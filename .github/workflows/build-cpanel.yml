# Build a full cPanel-ready zip (source + output + node_modules).
# Download from Actions → Artifacts → cpanel-dist → upload/extract on cPanel.

name: Build for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-build
  cancel-in-progress: true

jobs:
  build:
    name: Build download package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Node (cPanel)
        run: npm run build
        env:
          NITRO_PRESET: node-server

      - name: Prepare full package folder
        run: |
          set -e
          mkdir -p cpanel-dist

          # Source & assets
          cp -r src scripts public cpanel-dist/

          # App entry + manifests
          cp app.js package.json package-lock.json cpanel-dist/

          # Build / tooling config needed on the server
          cp vite.config.ts tsconfig.json drizzle.config.ts components.json cpanel-dist/
          cp eslint.config.js .prettierrc .prettierignore .gitignore cpanel-dist/ || true
          cp README.md cpanel-dist/ || true
          cp .env.example cpanel-dist/env.example.txt

          # Built Nitro server (visible name — not ".output")
          cp -r .output cpanel-dist/output

          # Dependencies (Linux) so cPanel can run without reinstalling first
          cp -r node_modules cpanel-dist/

          # Fail if critical pieces are missing
          test -f cpanel-dist/output/server/index.mjs
          test -d cpanel-dist/src
          test -d cpanel-dist/scripts
          test -d cpanel-dist/node_modules

          echo "=== Package top-level ==="
          ls -la cpanel-dist
          echo "=== Approximate size ==="
          du -sh cpanel-dist cpanel-dist/output cpanel-dist/node_modules cpanel-dist/src

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-dist
          path: cpanel-dist/
          include-hidden-files: true
          retention-days: 14
          compression-level: 9
